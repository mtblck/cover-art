name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate plugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - name: Check scripts parse
        run: |
          for f in skills/*/scripts/*.mjs; do node --check "$f"; done
          python3 -m py_compile skills/*/scripts/*.py
      - name: Check example SVGs are well-formed
        run: for f in skills/*/examples/*.svg; do python3 -c 'import sys, xml.dom.minidom as m; m.parse(sys.argv[1])' "$f"; done
